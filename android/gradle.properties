# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run builds in parallel where possible.
org.gradle.parallel=true

# Use AndroidX libraries instead of the legacy Android Support Library.
# Required: all dependencies in this project are AndroidX.
android.useAndroidX=true

# We have no legacy support-library deps, so Jetifier is not needed
# (leaving it off speeds up builds significantly).
android.enableJetifier=false

# Non-transitive R classes: each module sees only its own resources in R.
# Default since AGP 8.0, reduces build time and APK size.
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official
